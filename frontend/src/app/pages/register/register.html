<div class="auth-wrap">
  <form class="auth-card auth-card-single" (ngSubmit)="enviar()">
    <span class="auth-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9V6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5V9" />
        <path d="M3 9h18v7.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.5V9Z" />
        <path d="M8 13.5h8" />
      </svg>
    </span>
    <span class="eyebrow">Alta de usuario</span>
    <h2>Crear cuenta</h2>
    <p class="muted small">Regístrate como cliente del servicio de soporte TI.</p>

    @if (error(); as err) {
      <div class="alert alert-error">{{ err }}</div>
    }

    <label>
      Nombre completo
      <input type="text" name="nombre" [(ngModel)]="nombre" required placeholder="Juan Pérez" />
    </label>

    <label>
      Correo electrónico
      <input type="email" name="email" [(ngModel)]="email" required placeholder="usuario@empresa.com" />
    </label>

    <label>
      Contraseña
      <input type="password" name="password" [(ngModel)]="password" required minlength="6" placeholder="Mínimo 6 caracteres" />
    </label>

    <button class="btn btn-accent btn-block" type="submit">Registrarme</button>

    <p class="text-center muted">
      <a [routerLink]="['/login']">← Volver al inicio de sesión</a>
    </p>
  </form>
</div>
