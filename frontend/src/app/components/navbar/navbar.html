<header class="shell-header">
  <div class="shell-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9V6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5V9" />
        <path d="M3 9h18v7.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.5V9Z" />
        <path d="M8 13.5h8" />
      </svg>
    </span>
    <span class="brand-text">
      <strong>Triaje TI</strong>
      <em>mesa de ayuda con PLN</em>
    </span>
  </div>

  <nav class="segmented shell-nav">
    <a routerLink="/nuevo-ticket" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" /><path d="M12 8.5v7M8.5 12h7" />
      </svg>
      Nuevo ticket
    </a>
    <a routerLink="/bandeja" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13h4l2 3h6l2-3h4" />
        <path d="M5.5 5h13l2.5 8v4.5A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5V13l2.5-8Z" />
      </svg>
      Bandeja
    </a>
    @if (auth.esRol('analista', 'administrador')) {
      <a routerLink="/dashboard" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V9M10 19V4M16 19v-6M22 19H2" />
        </svg>
        Dashboard
      </a>
    }
    @if (auth.esRol('administrador')) {
      <a routerLink="/analistas" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.2" /><path d="M3.5 19a5.5 5.5 0 0 1 11 0" />
          <path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M17.5 14.2A5.5 5.5 0 0 1 20.5 19" />
        </svg>
        Analistas
      </a>
    }
  </nav>

  <div class="shell-user">
    @if (auth.usuario(); as u) {
      <span class="user-avatar" aria-hidden="true">{{ u.nombre.charAt(0).toUpperCase() }}</span>
      <span class="user-meta">
        <strong>{{ u.nombre }}</strong>
        <em>{{ u.rol }}</em>
      </span>
    }
    <button class="btn-ghost-icon" (click)="cerrarSesion()" title="Cerrar sesión" aria-label="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 12H4m0 0 3.5-3.5M4 12l3.5 3.5" />
        <path d="M10 5.5V4.5A1.5 1.5 0 0 1 11.5 3h7A1.5 1.5 0 0 1 20 4.5v15a1.5 1.5 0 0 1-1.5 1.5h-7a1.5 1.5 0 0 1-1.5-1.5v-1" />
      </svg>
    </button>
  </div>
</header>
